<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>نموذج تسجيل البيانات</title>
  <style>
    body { font-family: "Tahoma", sans-serif; background:#f5f5f5; display:flex; justify-content:center; align-items:center; height:100vh; }
    form { background:#fff; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); width:340px; }
    input { width:100%; margin:10px 0; padding:8px; border:1px solid #ccc; border-radius:6px; }
    button { width:100%; padding:10px; border:none;border-radius:6px;background:#4caf50;color:#fff;cursor:pointer;font-weight:bold; }
  </style>
</head>
<body>
  <form id="dataForm">
    <h3>📝 نموذج التسجيل</h3>
    <input type="text" id="fullName" placeholder="الاسم الخماسي" required>
    <input type="date" id="birthDate" required>
    <input type="text" id="education" placeholder="المؤهل العلمي" required>
    <input type="text" id="major" placeholder="التخصص" required>
    <button type="submit">إرسال</button>
  </form>

  <script>
    const form = document.getElementById('dataForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        fullName: document.getElementById('fullName').value,
        birthDate: document.getElementById('birthDate').value,
        education: document.getElementById('education').value,
        major: document.getElementById('major').value
      };
      await fetch("https://script.google.com/macros/s/AKfycbyrCouceFpeGnKiEenFwK2PzSJT2RdfHPnwigCU1OSkCfcJam3Pq64ExkTBjhHslmA6sw/exec", {
        method: "POST",
        mode: "no-cors",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
      });
      alert("✅ تم إرسال البيانات بنجاح!");
      form.reset();
    });
  </script>
</body>
</html>
